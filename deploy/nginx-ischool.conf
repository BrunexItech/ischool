# Drop this in as a NEW file on the VPS — it does not touch any existing
# server block for oqtekal.com or anything else already running there.
#
#   sudo cp nginx-ischool.conf /etc/nginx/sites-available/ischool.conf
#   sudo ln -s /etc/nginx/sites-available/ischool.conf /etc/nginx/sites-enabled/
#   sudo nginx -t   # check for conflicts with existing server blocks BEFORE reloading
#   sudo systemctl reload nginx
#
# Replace /etc/ssl/cloudflare/* with your actual Cloudflare Origin
# Certificate paths (see the runbook for how to generate one) — this is
# what makes Cloudflare's "Full (strict)" SSL mode work correctly.

server {
    listen 80;
    server_name ischool.oqtekal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ischool.oqtekal.com;

    ssl_certificate     /etc/ssl/cloudflare/ischool.oqtekal.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ischool.oqtekal.com.key;

    client_max_body_size 10M;  # logo/receipt uploads

    # API — strips the /api prefix before forwarding to FastAPI.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiveKit signaling (WebSocket) — the actual media (audio/video) travels
    # over the separate UDP port range directly to the VPS, never through
    # Nginx or Cloudflare.
    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Everything else — the Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
